name: flutter_doctor_ai
description: AI-powered Flutter code analysis CLI tool. Detects issues like large build methods, missing dispose, empty setState, and provides AI-powered fix suggestions.
version: 0.1.0

homepage: https://github.com/ashwanisng/flutter_doctor_ai
repository: https://github.com/ashwanisng/flutter_doctor_ai
issue_tracker: https://github.com/ashwanisng/flutter_doctor_ai/issues

topics:
  - flutter
  - analyzer
  - cli
  - lint
  - code-quality

environment:
  sdk: ^3.0.0

executables:
  flutter_doctor_ai: flutter_doctor_ai

dependencies:
  args: ^2.4.2
  analyzer: ^10.1.0
  path: ^1.8.3
  yaml: ^3.1.2
  dio: ^5.3.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0