name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: 📦 Install dependencies
        run: dart pub get

      - name: 🔍 Run analyzer
        run: dart analyze

      - name: 🧪 Run tests
        run: dart test

  publish:
    needs: analyze_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pub.dev

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: 📦 Install dependencies
        run: dart pub get

      - name: 🔎 Check if pubspec version is already published
        id: version_check
        run: |
          PACKAGE_NAME=$(grep '^name:' pubspec.yaml | head -1 | awk '{print $2}')
          LOCAL_VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "https://pub.dev/api/packages/$PACKAGE_NAME")

          if [ "$HTTP_STATUS" = "200" ]; then
            PUBLISHED_VERSION=$(jq -r '.latest.version' response.json)
          else
            PUBLISHED_VERSION=""
          fi

          echo "Local version:     $LOCAL_VERSION"
          echo "Published version: $PUBLISHED_VERSION"

          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish to pub.dev
        if: steps.version_check.outputs.should_publish == 'true'
        run: dart pub publish -f
