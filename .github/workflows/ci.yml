name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: 📦 Install dependencies
        run: dart pub get

      - name: 🔍 Run analyzer
        run: dart analyze

      - name: 🧪 Run tests
        run: dart test